stages:
  - build-test
  - deploy

default:
  image: maven:3.8.3-openjdk-17

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

build-job:
  inherit:
    default: true
    variables: true
  stage: build-test
  script:
    - mvn clean package
  artifacts:
    paths:
      - target/thymeleaf-springboot.jar
  cache:
    paths:
      - .m2/repository

build-docker-image-job:
  image: docker:latest
  inherit:
    default: false
    variables: false
  stage: deploy
  services:
    - docker:dind
  script:
    - docker build -t $DOCKER_USER/thymeleaf-springboot:latest .
    - docker save $DOCKER_USER/thymeleaf-springboot:latest > thymeleaf-springboot.tar
    - docker login -u $DOCKER_USER -p $DOCKER_HUB_TOKEN
    - docker push $DOCKER_USER/thymeleaf-springboot:latest
  artifacts:
    paths:
      - thymeleaf-springboot.tar
  when: manual